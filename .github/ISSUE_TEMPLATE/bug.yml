name: Fehler melden
description: Beschreibe ein Problem mit bereinigten Beispieldaten.
title: '[Fehler] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: 'Diese Meldung ist öffentlich. Keine Personendaten, echten Tickets, Zugangsdaten, internen URLs oder vertraulichen Screenshots angeben.'
  - type: checkboxes
    id: privacy
    attributes:
      label: Öffentliche Angaben
      options:
        - label: Ich habe vertrauliche Informationen entfernt und verwende nur öffentliche oder erfundene Beispieldaten.
          required: true
  - type: textarea
    id: behavior
    attributes:
      label: Was passiert?
      description: Beschreibe den Fehler und seine Auswirkungen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen
      placeholder: '1. …'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Was sollte stattdessen passieren?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version und Browser
      placeholder: Falls bekannt – keine internen Adressen angeben.
